<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Agora Arena">
  <!-- Agora Arena mark: an outlined lime "A" (AGORA) beside a solid white one (ARENA), the title's two-tone
       wordmark reduced to a monogram, on the arena's night navy. -->
  <rect width="100" height="100" rx="22" fill="#06101d"/>
  <g transform="translate(50 50) scale(.84) translate(-50 -50) skewX(-8) translate(5 0)">
    <path d="M14 76 L31 24 H43 L60 76 H48 L44.5 64 H29.5 L26 76 Z M32.5 54 H41.5 L37 39 Z" fill="none" stroke="#9df35b" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M44 76 L61 24 H73 L90 76 H78 L74.5 64 H59.5 L56 76 Z M62.5 54 H71.5 L67 39 Z" fill="#f7f8fb"/>
  </g>
</svg>
